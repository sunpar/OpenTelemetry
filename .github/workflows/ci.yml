name: Manual verification

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        options: [full, smoke, coverage]
        default: full

permissions:
  contents: read

jobs:
  verification:
    name: ${{ inputs.suite }} (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.lock
            requirements-dev.txt
            **/pyproject.toml

      - name: Install pinned dependencies
        run: make install-dev

      - name: Verify selected commit
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            full) make verify && make legacy-compose-config ;;
            smoke) make verify SUITE=smoke-check ;;
            coverage) make verify SUITE=coverage && make legacy-compose-config ;;
          esac

      - name: Save coverage report
        if: inputs.suite == 'coverage'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error
